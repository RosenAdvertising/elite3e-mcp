[project]
name = "elite3e-mcp"
version = "0.1.0"
description = "MCP server for Elite 3E: matters, clients, timecards and cost cards"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28.1,<1",
    "mcp>=2.3,<3",
    "pydantic>=2.11,<3",
]
classifiers = [
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/RosenAdvertising/elite3e-mcp"
Repository = "https://github.com/RosenAdvertising/elite3e-mcp"
Issues = "https://github.com/RosenAdvertising/elite3e-mcp/issues"

[project.scripts]
elite3e-mcp-setup = "elite3e_mcp.setup:setup"
elite3e-mcp-verify = "elite3e_mcp.setup:verify"
elite3e-mcp = "elite3e_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
