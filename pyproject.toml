[project]
name = "elite3e-mcp"
version = "0.1.0"
description = "MCP server for the Thomson Reuters Elite 3E REST API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28.1,<1",
    "mcp>=2.3,<3",
    "pydantic>=2.11,<3",
]

[project.scripts]
elite3e-mcp-setup = "elite3e_mcp.setup:setup"
elite3e-mcp-verify = "elite3e_mcp.setup:verify"
elite3e-mcp = "elite3e_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
